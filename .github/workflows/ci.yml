name: Phoenix Test Automation Workflow

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: "30 18 * * 1-5"
  workflow_dispatch:
    inputs:
      env:
        description: "Environment"
        type: choice
        options:
          - qa
          - uat
          - dev
        default: qa
        required: true

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'temurin'
          cache: maven
      - name: Execute Test Automation Framework
        run: mvn test -DsuiteXmlFile=testng.xml -Denv="{{ github.event.inputs.env }}"
      - name: Upload a Build Artifact
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: SureFire Report
          path: target/surefire-reports/
          retention-days: 10
